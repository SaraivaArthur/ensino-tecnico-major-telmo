<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria Responsiva</title>
  <link rel="stylesheet" href="estilos.min.css">
</head>
<body>
  <header class="cabecalho">
    <h1>Galeria de Projetos</h1>
    <p>Trabalhos desenvolvidos pela turma.</p>
  </header>
 
  <main class="galeria">
    <figure class="cartao">
      <img src="imagem1.jpg"
           alt="Descrição objetiva da primeira imagem"
           width="800" height="500" loading="imagem1.jpg">
      <figcaption>Projeto 1</figcaption>
    </figure>
 
    <figure class="cartao">
      <img src="imagem2.jpg"
           alt="Descrição objetiva da segunda imagem"
           width="800" height="500" loading="imagem2.jpg">
      <figcaption>Projeto 2</figcaption>
    </figure>
 
    <figure class="cartao">
      <img src="imagem3.jpg"
           alt="Descrição objetiva da terceira imagem"
           width="800" height="500" loading="imagem3.jpg">
      <figcaption>Projeto 3</figcaption>
    </figure>
  </main>
</body>
</html>
